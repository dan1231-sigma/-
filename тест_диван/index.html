<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вгадай країну</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="language-switcher" role="group" aria-label="Вибір мови">
        <button class="language-option is-active" type="button" data-language="uk" aria-label="Українська мова" aria-pressed="true">UA</button>
        <button class="language-option" type="button" data-language="en" aria-label="English language" aria-pressed="false">EN</button>
    </div>

    <div class="theme-switcher" role="group" aria-label="Вибір теми" alt="работає не трогай">
        <span class="theme-switcher__label">Тема</span>
        <div class="theme-switcher__track">
            <button class="theme-option" type="button" data-theme="light" aria-label="Світла тема" title="Світла тема">
                <span aria-hidden="true">☀</span>
            </button>
            <button class="theme-option" type="button" data-theme="dark" aria-label="Темна тема" title="Темна тема">
                <span aria-hidden="true">◐</span>
            </button>
            <button class="theme-option" type="button" data-theme="rgb" aria-label="RGB тема" title="RGB тема">
                <span aria-hidden="true">RGB</span>
            </button>
            <span class="theme-switcher__indicator" aria-hidden="true"></span>
        </div>
    </div>

    <div id="startScreen" class="screen">
        <div class="card">
            <p class="eyebrow">Географічна вікторина</p>
            <h1 class="Main">Вгадай країну</h1>
            <p class="intro">Перевір свою інтуїцію за прапором. 30 країн, одна спроба на кожну.</p>
            <button id="startBtn" type="button">START</button>
            <div id="apiError" class="hidden" aria-live="polite"></div>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden">
        <div class="panel">
            <div class="stats">
                <div id="questionLabel" class="stat">Питання: 1/30</div>
                <div id="scoreLabel" class="stat">Рахунок: 0</div>
                <div id="streakLabel" class="stat">Стрік: 0</div>
            </div>

            <img id="flag" src="" alt="Flag" />

            <input id="answerInput" type="text" placeholder="Введи назву країни" autocomplete="off" />

            <div class="actions">
                <button id="checkBtn" type="button">Перевірити</button>
                <button id="nextBtn" type="button" class="hidden">Наступна країна</button>
            </div>

            <div id="message" class="message" aria-live="polite"></div>
        </div>
    </div>

    <div id="resultScreen" class="screen hidden">
        <div class="result-card">
            <h2>Гру завершено!</h2>
            <p id="finalScore">0 / 30</p>
            <p id="resultPercent">0% правильних</p>
            <p id="maxStreakResult">Максимальний стрік: 0</p>

            <div class="actions">
                <button id="playAgainBtn" type="button">Грати ще раз</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
